project_name: "Kai Stop Test"
commands:
  - command: "./run.sh"
    name: "1. Go bridge + remote script (cleanup 4s)"
    type: "command"
  - command: "CLEANUP_SECS=12 ./run.sh"
    name: "2. Same, slow cleanup (12s, longer than the grace)"
    type: "command"
  - command: "docker compose -p kaistop up"
    name: "3. docker compose up"
    type: "command"
  - command: "./check.sh"
    name: "4. Check what survived"
    type: "command"
  - command: "docker compose -p kaistop down -t0"
    name: "5. Clean up compose"
    type: "command"
