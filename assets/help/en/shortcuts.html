<h2>Keyboard shortcuts</h2>
<table><tr><td><b>Ctrl+Shift+B</b></td><td>Show/hide Kai (global, configurable)</td></tr><tr><td><b>Ctrl+F</b></td><td>Show/focus search</td></tr><tr><td><b>Ctrl+N</b></td><td>New command</td></tr><tr><td><b>Ctrl+Shift+N</b></td><td>New folder</td></tr><tr><td><b>F2</b> / <b>Delete</b></td><td>Edit / delete the selected item</td></tr><tr><td><b>Ctrl+Q</b></td><td>Quit Kai</td></tr><tr><td><b>Double click</b></td><td>Runs the command</td></tr></table><p>All remappable in <b>Settings</b>.</p>
