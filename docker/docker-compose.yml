services:
  kai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kai-dev
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.config/kai:/root/.config/kai
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true

volumes:
  kai-config: