<h2>Importar OpenAPI/Swagger</h2>
<p>Menu <b>Arquivo → Importar OpenAPI/Swagger</b>. Escolha um arquivo <b>JSON</b> (OpenAPI 3.x ou Swagger 2.0). O Kai cria uma <b>pasta</b> com o título da API e um <b>comando HTTP por endpoint</b> (método + URL base + body de exemplo).</p><div class='tip'>YAML ainda não é suportado — converta a spec para JSON.</div>
