project_name: "API starter"
icon: "globe"
env_vars:
  API_BASE: "https://httpbin.org"
http_defaults:
  headers:
    - name: "Accept"
      value: "application/json"
commands:
  - name: "Get"
    type: "http"
    http_config:
      url: "{{API_BASE}}/get"
  - name: "Status 204"
    type: "http"
    http_config:
      url: "{{API_BASE}}/status/204"
