<h2>Histórico de execuções (Runs)</h2>
<p>Menu <b>Processos → Histórico de execuções</b>. Lista as últimas execuções (Shell e HTTP) com <b>timestamp</b>, status, duração e a <b>saída salva</b>.</p><p>Selecione um run para ver a saída; <b>Reexecutar</b> dispara o comando de novo; <b>Limpar</b> zera o histórico.</p>
