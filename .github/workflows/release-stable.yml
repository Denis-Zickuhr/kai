name: Release (stable)

# Signed release. Tag vX.Y.Z on the main branch. Signing is switched on with the
# repository variable SIGNPATH_ENABLED=true (after SignPath Foundation approves the project).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag is not on the main branch"; exit 1; }
          CORE="$(grep -oP 'project\(kai VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          PRE="$(grep -oP 'set\(KAI_VERSION_PRERELEASE "\K[^"]*' CMakeLists.txt)"
          [[ -z "$PRE" && "$VERSION" == "$CORE" ]] || { echo "Tag $VERSION does not match CMakeLists.txt ($CORE${PRE:+-$PRE})"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build \
            qt6-base-dev qt6-svg-dev qt6-base-dev-tools libgl1-mesa-dev libxkbcommon-dev
      - run: |
          cmake -B build-dev -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DKAI_SHARED_LIBS=ON
          cmake --build build-dev --parallel
      - env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-dev --output-on-failure --timeout 300

  build:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Windows (portable folder) and Linux (AppImage)
        run: |
          mkdir -p dist && chmod 777 dist
          docker compose build build-windows build-linux
          docker compose run --rm build-windows
          docker compose run --rm build-linux
      - name: Collect the files to sign
        run: |
          mkdir to-sign
          cp dist/kai-windows/kai.exe dist/kai-windows/kai.com to-sign/
      - id: upload-unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-exes
          path: to-sign/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dist
          path: |
            dist/kai-windows
            dist/Kai-x86_64.AppImage
          if-no-files-found: error
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}

  sign-exes:
    needs: build
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: exes
          github-artifact-id: ${{ needs.build.outputs.unsigned-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-exes
          path: signed-exes/*
          if-no-files-found: error

  package:
    needs: [verify, build, sign-exes]
    # Runs unsigned only while signing is off; once SIGNPATH_ENABLED=true the signed exes are required.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-exes.result == 'success' || vars.SIGNPATH_ENABLED != 'true' && needs.sign-exes.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dist
          path: dist
      - name: Use the signed executables
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-exes
          path: dist/kai-windows
      - name: Build the installer and the portable zip
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis zip
          mkdir out
          makensis -V2 -DAPPVERSION="$VERSION" -DAPPVERSION_NUM="$VERSION.0" \
            -DKAISRC="$PWD/dist/kai-windows" -DKAIOUT="$PWD/out" packaging/windows/kai.nsi
          mv out/kai-setup.exe "out/kai-$VERSION-setup.exe"
          (cd dist/kai-windows && zip -qr "../../out/kai-$VERSION-windows-x86_64.zip" .)
          cp dist/Kai-x86_64.AppImage "out/kai-$VERSION-linux-x86_64.AppImage"
      - id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: out/kai-*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/*
          if-no-files-found: error

  sign-installer:
    needs: package
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ needs.package.outputs.installer-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-installer
          path: signed-installer/*
          if-no-files-found: error

  publish:
    needs: [verify, package, sign-installer]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.sign-installer.result == 'success' || vars.SIGNPATH_ENABLED != 'true' && needs.sign-installer.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Use the signed installer
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-installer
          path: out
      - name: Publish
        run: |
          (cd out && sha256sum * > SHA256SUMS)
          NOTE="Stable release."
          [[ "${{ vars.SIGNPATH_ENABLED }}" == "true" ]] || NOTE="Stable release (not yet code-signed)."
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Kai $VERSION" --notes "$NOTE"
