<h2>Execution history (Runs)</h2>
<p>Menu <b>Processes → Execution history</b>. Lists the latest executions (Shell and HTTP) with <b>timestamp</b>, status, duration and the <b>saved output</b>.</p><p>Select a run to view its output; <b>Re-run</b> triggers the command again; <b>Clear</b> resets the history.</p>
