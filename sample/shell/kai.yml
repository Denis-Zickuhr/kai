collections:
  - entries:
      - favorite: true
        id: "cli_1"
        tags:
          - "vip"
        values:
          email: "ana@exemplo.dev"
          nome: "Ana Souza"
          plano: "pro"
      - favorite: false
        id: "cli_2"
        tags: []
        values:
          email: "bruno@exemplo.dev"
          nome: "Bruno Lima"
          plano: "free"
    icon: "users"
    name: "Clientes"
    schema:
      - label: "Nome"
        name: "nome"
        type: "text"
      - label: "E-mail"
        name: "email"
        type: "text"
      - label: "Plano"
        name: "plano"
        type: "text"
commands:
  - command: "echo \"Executando {{APP_NAME}} no ambiente: {{ENVIRONMENT}}\""
    name: "1. Hello World (Env Vars)"
    type: "command"
  - command: "for i in 1 2 3 4 5; do echo \"[Kai] Processando passo $i de 5...\"; sleep 1; done"
    name: "2. Loop com Progresso (Saída em Tempo Real)"
    type: "command"
  - command: "printf 'Digite seu nome: ' && read NOME && echo \"Olá, $NOME!\" && printf 'Confirmar operação? (s/n): ' && read CONF && echo \"Resposta: $CONF\""
    name: "3. Leitura Interativa (STDIN / PTY Test)"
    type: "command"
  - command: "echo \"Texto={{TEXTO}} | Env={{AMBIENTE_SEL}} | Forçar={{FORCAR}} | Arquivo={{ARQUIVO}}\""
    name: "4. Todos os Tipos de Parâmetros"
    params:
      - default: "meu-subdominio"
        label: "Texto Livre"
        name: "TEXTO"
        type: "text"
      - default: "dev"
        label: "Ambiente Alvo"
        name: "AMBIENTE_SEL"
        options:
          - "dev"
          - "staging"
          - "production"
        type: "select"
      - default: false
        label: "Forçar Recompilação"
        name: "FORCAR"
        type: "bool"
      - default: ""
        label: "Selecione o Certificado"
        name: "ARQUIVO"
        type: "file"
    type: "command"
  - command: "echo \"UUID={{$uuid}} | Timestamp={{$timestamp}} | ISO={{$isoTimestamp}} | Random={{$randomInt}}\""
    name: "5. Variáveis Dinâmicas & Faker"
    type: "command"
  - command: "echo \"Token de acesso (mascarado na UI): {{SECRET_TOKEN}}\""
    name: "6. Secret Var (Mascarada)"
    type: "command"
  - command: "echo \"Diretório de execução atual: $(pwd)\""
    name: "7. Working Directory Customizado"
    type: "command"
    working_dir: "{{PROJECT_PATH}}"
  - command: "for i in $(seq 1 60); do echo \"[Background Job] Tick $i...\"; sleep 2; done"
    is_background: true
    name: "8. Processo em Background (Daemon)"
    type: "command"
  - command: "echo \"Enviando notificação para {{cliente.nome}} <{{cliente.email}}> (Plano: {{cliente.plano}})\""
    name: "9. Saudar Cliente (Puxando de Coleção)"
    params:
      - collection: "Clientes"
        collection_display_field: "nome"
        label: "Selecione o Cliente"
        name: "cliente"
        type: "select"
    type: "command"
  - command: "echo \"Selecionados: {{PASTAS}}\""
    name: "10. Lista Dinâmica (Opções por Script)"
    params:
      - label: "Pasta do projeto (uma por vez)"
        name: "PASTA"
        options_script: "for d in */; do echo \"${d%/}\"; done"
        type: "select"
      - label: "Várias pastas (rótulo:valor)"
        multi_select: true
        name: "PASTAS"
        options_script: "for d in */; do echo \"Pasta ${d%/}:${d%/}\"; done"
        type: "select"
    type: "command"
  - command: "echo \"Escolhido: {{VAZIO}}\""
    name: "11. Lista Dinâmica Vazia (Script sem Saída)"
    params:
      - label: "Opção (o script não imprime nada)"
        name: "VAZIO"
        options_script: "true"
        type: "select"
    type: "command"
  - command: "echo \"Itens ({{itens__count}}):\"; echo \"{{itens}}\""
    name: "12. Grid: uma linha por registro"
    params:
      - columns:
          - label: "Produto"
            name: "produto"
            type: "text"
          - default: "1"
            label: "Quantidade"
            name: "qtd"
            type: "number"
          - label: "Urgente"
            name: "urgente"
            type: "bool"
        label: "Itens do pedido"
        name: "itens"
        required: true
        row_separator: "\\n"
        row_template: "- {{produto}} x{{qtd}} (urgente: {{urgente}})"
        type: "grid"
    type: "command"
  - command: "echo '{{itens__json}}'"
    name: "13. Grid: array JSON"
    params:
      - columns:
          - label: "Produto"
            name: "produto"
            type: "text"
          - default: "0"
            label: "Preço"
            name: "preco"
            type: "number"
        label: "Itens"
        name: "itens"
        type: "grid"
    type: "command"
  - command: "echo \"Deploy {{service}} -> {{env}} ({{region}})\"; echo \"retries={{retries}} dry_run={{dry_run}} timeout={{timeout}}\"; echo \"Hosts ({{hosts__count}}):\"; echo \"{{hosts}}\"; echo \"Note: {{note}}\""
    name: "14. Etapas: assistente de deploy"
    params:
      - label: "Ambiente"
        name: "env"
        options:
          - "dev"
          - "staging"
          - "production"
        required: true
        step: "Destino"
        type: "select"
      - label: "Serviços"
        multi_select: true
        name: "service"
        options:
          - "api"
          - "worker"
          - "web"
        required: true
        step: "Destino"
        type: "select"
      - default: "sa"
        label: "Região"
        name: "region"
        options:
          - "sa"
          - "us"
          - "eu"
        step: "Destino"
        type: "select"
      - default: "3"
        label: "Tentativas"
        name: "retries"
        step: "Opções"
        type: "number"
      - default: true
        label: "Simulação (dry run)"
        name: "dry_run"
        step: "Opções"
        type: "bool"
      - default: "60"
        group: "Avançado"
        label: "Timeout (s)"
        name: "timeout"
        step: "Opções"
        type: "number"
      - columns:
          - label: "Host"
            name: "host"
            type: "text"
          - default: "22"
            label: "Porta"
            name: "port"
            type: "number"
          - default: true
            label: "TLS"
            name: "tls"
            type: "bool"
        label: "Servidores"
        name: "hosts"
        required: true
        row_separator: "\\n"
        row_template: "- {{host}}:{{port}} (tls: {{tls}})"
        step: "Servidores"
        type: "grid"
      - label: "Observação"
        name: "note"
        optional: true
        step: "Revisão"
        type: "textarea"
    type: "command"
env_vars:
  APP_NAME: "KaiShell"
  ENVIRONMENT: "development"
  SECRET_TOKEN: "tok_live_9988776655"
icon: "terminal"
project_name: "Kai Shell & Controls Demo"
