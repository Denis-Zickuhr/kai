<h2>Atalhos de teclado</h2>
<table><tr><td><b>Ctrl+Shift+B</b></td><td>Mostrar/ocultar o Kai (global, configurável)</td></tr><tr><td><b>Ctrl+F</b></td><td>Mostrar/focar a busca</td></tr><tr><td><b>Ctrl+N</b></td><td>Novo comando</td></tr><tr><td><b>Ctrl+Shift+N</b></td><td>Nova pasta</td></tr><tr><td><b>F2</b> / <b>Delete</b></td><td>Editar / excluir item selecionado</td></tr><tr><td><b>Ctrl+Q</b></td><td>Sair do Kai</td></tr><tr><td><b>Duplo clique</b></td><td>Executa o comando</td></tr></table><p>Todos remapeáveis em <b>Configurações</b>.</p>
