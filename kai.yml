commands:
  - cli_path: "up"
    command: "docker compose -f docker/docker-compose.yml up"
    description: "Starts the kai-dev container (docker compose up). Its main process is docker/watch.sh, which rebuilds and relaunches the app on every change."
    folder: "Dev"
    icon: "power"
    name: "Start dev container"
    type: "command"
  - cli_path: "down"
    command: "docker compose -f docker/docker-compose.yml down"
    description: "Stops and removes the kai-dev container."
    folder: "Dev"
    icon: "power-off"
    name: "Stop dev container"
    type: "command"
  - cli_path: "watch"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash docker/watch.sh"
    description: "Runs docker/watch.sh in the container, rebuilding and relaunching Kai on every change under src/."
    folder: "Dev"
    icon: "eye"
    is_background: true
    name: "Run Kai with auto-reload"
    type: "command"
  - cli_path: "once"
    command: "docker exec -d {{KAI_DEV_CONTAINER}} bash -c \"cd /workspace/{{KAI_BUILD_DIR}} && ./bin/kai > /tmp/kai.log 2>&1\""
    description: "Starts the already built Kai in the container, without watching for changes. Log in /tmp/kai.log inside the container."
    folder: "Dev"
    icon: "play"
    name: "Run Kai once"
    type: "command"
  - cli_path: "procs"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash -c \"ps aux | grep '/workspace/{{KAI_BUILD_DIR}}/bin/kai' | grep -v grep\""
    description: "Shows the Kai processes running inside the container, with their PIDs (use with `kai dev stop`)."
    folder: "Dev"
    icon: "search"
    name: "List Kai processes in the container"
    type: "command"
  - cli_path: "stop"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash -c \"kill {{pid}}\""
    description: "Kills one Kai process inside the container by PID."
    folder: "Dev"
    icon: "circle-stop"
    name: "Stop a Kai process in the container"
    params:
      - description: "PID of the Kai process to kill (see `kai dev procs`)."
        label: "Process PID"
        name: "pid"
        type: "text"
    type: "command"
  - cli_path: "all"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash -c \"cd /workspace && ctest --test-dir {{KAI_BUILD_DIR}} --output-on-failure\""
    description: "Runs every Qt Test through ctest in the container, printing the output of failed tests."
    folder: "Tests"
    icon: "list-checks"
    name: "Run the full test suite"
    type: "command"
  - cli_path: "one"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash -c \"cd /workspace && ./{{KAI_BUILD_DIR}}/bin/{{test}}\""
    description: "Runs a single test binary from the repository root, so tests that look up assets/ find them."
    folder: "Tests"
    icon: "flask-conical"
    name: "Run a single test"
    params:
      - default: "test_i18n_sync"
        description: "Name of the test binary in dist/dev/bin, e.g. test_cli_completion."
        label: "Test binary"
        name: "test"
        optional: true
        type: "text"
    type: "command"
  - cli_path: "i18n"
    command: "docker exec {{KAI_DEV_CONTAINER}} bash -c \"cd /workspace && ./{{KAI_BUILD_DIR}}/bin/test_i18n_sync\""
    description: "Runs test_i18n_sync, which fails on keys missing from a language pack or not used by any code."
    folder: "Tests"
    icon: "languages"
    name: "Check translations"
    type: "command"
  - cli_path: "linux"
    command: "docker compose run --rm build-linux"
    description: "Builds the Linux AppImage in a container; the output goes to dist/."
    folder: "Release"
    icon: "package"
    name: "Build Linux AppImage"
    type: "command"
  - cli_path: "windows"
    command: "KAI_BUILD_INSTALLER=1 docker compose run --rm build-windows"
    description: "Cross-compiles the portable Windows build plus the installer; the output goes to dist/."
    folder: "Release"
    icon: "package"
    name: "Build Windows package"
    type: "command"
  - cli_path: "current"
    command: "gh release view \"$(git describe --tags --abbrev=0)\" --json tagName,assets"
    description: "Shows the latest tag's GitHub release and its published assets."
    folder: "Release"
    icon: "eye"
    name: "Show current release"
    type: "command"
  - cli_path: "publish-kip"
    command: "./packaging/release.sh --kip"
    description: "The same packaging/release.sh, but with the Kai interface (KIP) instead of terminal questions - a form, the plan as a confirmation (red when it pushes or publishes) and a live checklist."
    folder: "Release"
    icon: "rocket"
    kip: true
    name: "Publish a release"
    type: "command"
env_vars:
  KAI_BUILD_DIR: "dist/dev"
  KAI_DEV_CONTAINER: "kai-dev"
folders:
  - cli_description: "Dev container and the Kai running inside it"
    cli_path: "dev"
    icon: "container"
    name: "Dev"
    order: 0
    path: "Dev"
  - cli_description: "Qt Test suite"
    cli_path: "test"
    icon: "flask-conical"
    name: "Tests"
    order: 1
    path: "Tests"
  - cli_description: "Packaging and publishing"
    cli_path: "release"
    icon: "rocket"
    name: "Release"
    order: 2
    path: "Release"
kai_export:
  id_free: true
  scope: "folder"
  version: 1
